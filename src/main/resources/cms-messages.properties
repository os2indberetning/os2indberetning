
cms.help.four.km.rule=Ved brug af 4-km-reglen henvises der vil vejledningen.
#cms.help.four.km.rule.value=Afstand til kommunegrænse. Har du bopæl i kommunen skal det være 0 km

cms.help.sixty.day.rule=Hvis du kører minimum 60 dage mellem din bopæl og en erhvervsrettet adresse i en forudgående periode på 12 måneder, kan du være omfattet af 60 dages reglen. Læs mere på www.skat.dk

cms.help.mobile.token=Der er også mulighed for at indberette befordring via en app. Mobiltoken bruges til at forbinde din mobile enhed med eIndberetning. Du kan høre mere om app’en ved din leder.

cms.help.license.plate.primary=Den primære nummerplade bruges ved mobil-indberetninger.
cms.help.license.plate.not.registered=Du skal oprette din nummerplade under Personlige indstillinger, før du kan indberette kørslen.

cms.help.alternative.home.to.work.distance=Hvis systemet beregner en anden afstand end den du egentlig kører, kan du her indtaste den faktiske afstand mellem bopæl og arbejdsplads. HUSK! Denne faktiske afstand også er dén du skal indberette til rubrik 51 på din forskudsopgørelse ved Skat. Feltet må ikke indeholde komma eller punktum.
cms.help.alternative.address.home=Hvis du i en periode bor et andet sted end din primære hjemmeaddresse kan du her indtaste en afvigende hjemmeaddresse
cms.help.alternative.address.work=Hvis du i en periode arbejder et andet sted din primære arbejdsaddresse kan du her indtaste en afvigende arbejdsaddresse

cms.help.report.purpose=Her skal du fyldestgørende beskrive formålet med din kørsel. Du skal fx skrive Møde ang. OS2indberetning i Ebeltoft
cms.help.sub.terminated=En eller flere af personerne i denne kontekst er fratrådt. Dette betyder at denne tildeling ikke har nogen effekt
#cms.help.report.comment=Yderligere bemærkninger til den kørte rute.

cms.help.personal.approver=Du kan oprette en afvigende godkender for en enkelt medarbejder, således denne medarbejders indberetning sendes til en anden godkender, end den der normalt godkender vedkommendes indberetninger. Typisk foretages denne type afvigelser på person niveau på ledere, chefer eller direktører. Der kan kun oprettes afvigende godkendere for underliggende niveauer (det vil sige chefer kan oprette for ledere som eksempel).

cms.help.email.deadline.subject=Du har indberetninger af kørsel der afventer din godkendelse
cms.help.email.deadline.body=Du har indberetninger af kørsel, der afventer din godkendelse i OS2Indberetning. Fristen for godkendelse til næste lønudbetaling er d. {deadline}

cms.help.address.wash.map.to.address=Klik denne knap, for at udfylde adresse information baseret på koordinater
cms.help.address.wash.address.to.map=Klik denne knap, for at finde koordinater baseret på den manuelt indtastede adresse
