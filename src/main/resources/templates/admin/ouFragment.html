<!DOCTYPE html>
<html>
<div id="wrapper">
    <div class="col-sm-12">
        <div class="row" style="margin-bottom:10px;">
            <div class="col-sm-8">
                <h4>Afdelings-indstillinger</h4>
            </div>
        </div>
        <div class="table-responsive">
            <table style="padding-right:0px !important;" id="ouTable"
                   class="table table-striped table-bordered table-hover">
                <thead>
                <tr>
                    <th>Organisations ID</th>
                    <th>Navn</th>
                    <th>Kan benytte 4km-regel</th>
                    <th>Standard kilometeropgørelse</th>
<!--                    <th>Adresse</th>-->
                    <th>Rediger</th>
                </tr>
                </thead>
                <tfoot style="display: table-row-group">
                    <tr>
                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Id" /></td>
                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Navn" /></td>
                        <td></td>
                        <td></td>
<!--                        <td class="input-filter"><input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Dato" /></td>-->
                        <td></td>
                    </tr>
                </tfoot>
                <tbody>
                <tr th:each="ou : ${orgUnits}">
                    <td th:text="${ou.orgId}"></td>
                    <td th:text="${ou.longDescription}"></td>
                    <td th:switch="${ou.fourKmRuleAllowed}">
                        <i th:case="true" class="fa fa-check" aria-hidden="true"></i>
                        <i th:case="false" class="fa fa-times" aria-hidden="true"></i>
                    </td>
                    <td th:text="${ou.defaultCalculationType.message}"></td>
<!--                    <td th:text="${ou.address?.getAddressString()}"></td>-->
                    <td>
                        <a th:data-orgid="${ou.orgId}" th:data-rule="${ou.fourKmRuleAllowed}" th:data-type="${ou.defaultCalculationType.name()}" onclick="ouService.openModal(this)"><em style="color: #212529" class="fa fa-pencil"></em></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class ="modal inmodal" id="orgUnitModal" role="dialog" style="display: none" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content animated fadeIn">
                    <div class="modal-header">
                        <H4>Rediger en afdeling</H4>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="typeId">
                        <div class="form-group row">
                            <label class="col-sm-5 col-form-label" style="text-align:left;">Standard kilometeropgørelse for medarbejdere</label>
                            <div class="col-sm-7">
                                <select class="form-control" id="calculationTypeSelect">
                                    <option th:each="type : ${T(dk.digitalidentity.indberetning.model.entity.enums.CalculationType).values()}" th:text="${type.message}" th:value="${type.name()}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-5 col-form-label" style="text-align:left;">Kan bruge 4km regel</label>
                            <div class="col-sm-7">
                                <input type="checkbox" class="i-checks" id="kmRuleCheck">
                            </div>
                        </div>
<!--                        <div class="form-group row">-->
<!--                            <label class="col-sm-5 col-form-label" style="text-align:left;">Enhedens adresse</label>-->
<!--                            <div class="col-sm-7">-->
<!--                                <input class="addressinput form-control" type="text" id="addressField" placeholder="Indtast adresse her" autocomplete="off" list="addressFieldList">-->
<!--                                <dataList id="addressFieldList"></dataList>-->
<!--                            </div>-->
<!--                        </div>-->
                    </div>
                    <div class="modal-footer">
                        <div style="display: flex">
                            <button type="button" class="btn btn-block btn-danger" style="margin: 5px" onclick="ouService.closeModal()">Annuller</button>
                            <button type="button" class="btn btn-block btn-success" id="butRateCreate" style="margin: 5px" onclick="ouService.saveChanges(this)">Gem</button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
