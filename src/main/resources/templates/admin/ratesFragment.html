<!DOCTYPE html>
<html>
<div id="wrapper">
    <div class="col-sm-12">
        <div class="row" style="margin-bottom:10px;">
            <div class="col-sm-8">
                <h4>Takster</h4>
            </div>
            <div class="col-sm-4">
                <button type="button" class="btn btn-primary" style="float: right;" onclick="rateService.create()">Tilføj ny takst</button>
            </div>
        </div>
        <div class="table-responsive">
            <table style="padding-right:0px !important;" id="rateTable" class="table table-striped table-bordered table-hover" >
                <thead>
                <tr>
                    <th>År gældende</th>
                    <th>Øre/km</th>
                    <th>Taksttype</th>
                    <th>Handlinger</th>
                </tr>
                </thead>
                <tfoot style="display: table-row-group">
                <tr>
                    <td class="input-filter"><input type="number" class="form-control input-sm" placeholder="Søg i År" /></td>
                    <td class="input-filter"><input type="number" class="form-control input-sm" placeholder="Søg i øre/km" /></td>
                    <td class="input-filter">
                        <select class="form-control">
                            <option selected="selected" value="">Alle</option>
                            <option th:each="rateTypes: ${rateTypes}" th:value="${rateTypes.name}" th:text="${rateTypes.name}"></option>
                        </select>
                    </td>
                </tr>
                </tfoot>
                <tbody>
                <tr th:each="rate : ${rates}">
                    <td th:text="${rate.activeYear}"></td>
                    <td th:text="${rate.ratePerKm}"></td>
                    <td th:text="${rate.rateType.name}">
                    <td style="display: flex">
                        <a th:data-id="${rate.id}" th:data-activeYear="${rate.activeYear}" th:data-rateType="${rate.rateType.id}" th:data-ratePerKm="${rate.ratePerKm}" th:onclick="rateService.edit(this)" style="color: black; margin-left: 10px" title="Rediger"><em class="fa fa-lg fa-pencil"></em></a>
                        <a th:data-id="${rate.id}" th:onclick="rateService.del(this)" style="color: black; margin-left: 10px;" title="Slet"><em class="fa fa-lg fa-times"></em></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="modal inmodal" id="rateModal" tabindex="-1" role="dialog" style="display: none;" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content animated fadeIn">
                    <div class="modal-header">
                        <button type="button" class="close" onclick="rateService.closeModal()">
                            <span><em class="fa fa-lg fa-times"></em></span>
                            <span class="sr-only">Luk</span>
                        </button>
                        <h4 class="modal-title">Tilføj/rediger takst</h4>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="rateId">
                        <div class="form-group row">
                            <label class="col-sm-2 col-form-label" style="text-align:left;">År gældende</label>
                            <div class="col-sm-10">
                                <input type="number" class="form-control" id="rateYear" placeholder="Indtast År gældende">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-2 col-form-label" style="text-align:left;">Øre/km</label>
                            <div class="col-sm-10">
                                <input type="number" class="form-control" id="ratePerKm" placeholder="Indtast Øre/km">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-2 col-form-label" style="text-align:left;">Taksttyper</label>
                            <div class="col-sm-10">
                                <select class="form-control" id="rateTypeSelect">
                                    <option selected="selected" value="">Vælg taksttype</option>
                                    <option th:each="rateTypes: ${rateTypes}" th:value="${rateTypes.id}" th:text="${rateTypes.name}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" onclick="rateService.closeModal()">Annuller</button>
                        <button type="button" class="btn btn-success" id="butRateCreate" onclick="rateService.createSave()">Opret</button>
                        <button type="button" class="btn btn-success" id="butRateEdit" onclick="rateService.editSave()">Gem ændring</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
