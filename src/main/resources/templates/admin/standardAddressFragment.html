<!DOCTYPE html>
<html>
<div id="wrapper wrapper-content">
    <div class="row" style="display: flex; margin: 2%">
        <div class="column" style="width: 45%; align: left;">
            <h1 style="text-align:left;">Standard adresser</h1>

            <div class="table-responsive">
                <table style="padding-right:0px !important;" id="standardAddressTable" class="table table-striped table-bordered table-hover" >
                    <thead>
                        <tr>
                            <th>Adresser</th>
                            <th>Beskrivelse</th>
                            <th>Primær</th>
                            <th>Handlinger</th>
                        </tr>
                    </thead>
                    <tfoot style="display: table-row-group">
                        <tr>
                            <td class="input-filter"><input type="text" class="form-control input-sm" placeholder="Søg i adresser" /></td>
                            <td class="input-filter"><input type="text" class="form-control input-sm" placeholder="Søg i beskrivelse" /></td>
                            <td></td>
                        </tr>
                    </tfoot>
                    <tbody>
                        <tr th:each="address : ${addresses}">
                            <td th:text="${address.getAddressString}"></td>
                            <td th:text="${address.description}"></td>
                            <td><a th:class="${address.primary} ? 'fa fa-check-circle'"/></td>
                            <td style="display: flex">
                                <a href="#standardAddresses" th:data-id="${address.id}" th:onclick="standardAddressService.primeAddress(this)" style="color: black; margin-left: 10%" title="Gør Primær"><em class="fa fa-check-circle"></em></a>
                                <a href="#standardAddresses" th:data-id="${address.id}" th:data-lat="${address.latitude}" th:data-lng="${address.longitude}" th:data-addressString="${address.getAddressString}" th:data-description="${address.description}" th:onclick="standardAddressService.edit(this)" style="color: black; margin-left: 10%" title="Rediger"><em class="fa fa-lg fa-pencil"></em></a>
                                <a href="#standardAddresses" th:data-id="${address.id}" th:onclick="standardAddressService.del(this)" style="color: black; margin-left: 10%;" title="Slet"><em class="fa fa-lg fa-times"></em></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>


            <h1 style="text-align:left;">Tilføj standard adresse</h1>
            <div class="row">
                <label class="col-sm-2 col-form-label" style="text-align:left;">Tilføj adresse</label>
                <div class="col-sm-10">
                    <input class="addressinput form-control" type="text" id="standardAddressField" placeholder="Indtast adresse her" autocomplete="off" list="standardAddressFieldList">
                    <dataList id="standardAddressFieldList"></dataList>
                </div>
            </div>
            <div class="row">
                <label class="col-sm-2 col-form-label" style="text-align:left;">beskrivelse</label>
                <div class="col-sm-10">
                    <input class="form-control" type="text" id="standardDescriptionField" placeholder="Skriv beskrivelse">
                </div>
            </div>
            <div class="row">
                <div id="idField" hidden="hidden"></div>
                <button type="button" id="infoButton" class="btn btn-lg btn-warning" onclick="standardAddressService.loadFragment()">Nulstil</button>
                <button type="button" id="saveButton" class="btn btn-lg btn-primary" onclick="standardAddressService.save()">Gem</button>
                <button type="button" id="editButton" class="btn btn-lg btn-info" onclick="standardAddressService.editSave()" hidden="hidden" disabled>Ændre</button>
            </div>
        </div>
        <div class="column" style="width: 5%; align: center;"></div>
        <div class="column" style="width: 50%; align: right;">
            <div id="standardAddressMap" style="height: 100%;" th:data-lat="${primaryAddress.latitude}" th:data-lng="${primaryAddress.longitude}"></div>
        </div>
    </div>
</div>

</html>
