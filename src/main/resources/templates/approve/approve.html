<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (datatables = true, checkbox = true, select2 = true, leaflet = true, moment = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/navbar :: topbar(page = 'approve')}"></div>

        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-md-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h5><em class="fa fa-pencil-square-o fa-lg"></em> &nbsp; Godkend</h5>
                        </div>

                        <div class="ibox-content" >
                            <div class="tabs-container">
                                <ul class="nav nav-tabs rememberPosition" role="tablist">
                                    <li><a class="nav-link active" data-toggle="tab" href="#status-pending"> Afventer godkendelse</a></li>
                                    <li><a class="nav-link" data-toggle="tab" href="#status-approved">Godkendte</a></li>
                                    <li><a class="nav-link" data-toggle="tab" href="#status-rejected">Afviste</a></li>
                                    <li><a class="nav-link" data-toggle="tab" href="#substitutes">Stedfortrædere og godkendere</a></li>
                                    <li><a class="nav-link" data-toggle="tab" href="#reportCard">Rapportering</a></li>
                                </ul>
                                <div class="tab-content">
                                    <div role="tabpanel" id="status-pending" class="tab-pane active">
                                        <div class="panel-body">
                                            <div th:replace="~{report/listFragment :: report-list(status = 'PENDING', adminView = true)}"></div>
                                        </div>
                                    </div>

                                    <div role="tabpanel" id="status-approved" class="tab-pane">
                                        <div class="panel-body">
                                            <div th:replace="~{report/listFragment :: report-list(status = 'ACCEPTED', adminView = true)}"></div>
                                        </div>
                                    </div>
                                    <div role="tabpanel" id="status-rejected" class="tab-pane">
                                        <div class="panel-body">
                                            <div th:replace="~{report/listFragment :: report-list(status = 'REJECTED', adminView = true)}"></div>
                                        </div>
                                    </div>
                                    <div role="tabpanel" id="substitutes" class="tab-pane">
                                        <div class="panel-body">
                                            <div id="approverFragmentDiv"></div>
                                        </div>
                                    </div>
                                    <div role="tabpanel" id="reportCard" class="tab-pane">
                                        <div class="panel-body" id="tab-5-body">
                                            <div id="reportCardFragmentDiv"></div>
                                        </div>
                                    </div>
                                    <div th:replace="~{report/listFragment :: report-list-approve-modal (adminView= true)}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
        <div th:replace="~{fragments/footer :: scripts (datatables = true, checkbox = true, tabs = true, select2 = true, leaflet = true, moment = true)}"></div>
    </div>
</div>
<div class="modal inmodal" id="mapFragModal" tabindex="-1" role="dialog" style="display: none;" aria-hidden="true">
    <div class="modal-dialog modal-lg" style="height: 90%;">
        <div class="modal-content animated fadeIn" style="height: 90%;">
            <div class="modal-header">
                <button type="button" class="close" onclick="showRouteService.close()">
                    <span><em class="fa fa-lg fa-times"></em></span>
                    <span class="sr-only">Luk</span>
                </button>
                <h4 class="modal-title">Vis Rute på kort</h4>
            </div>
            <div class="modal-body" style="height: calc(100vh-143px); overflow-y: auto;">
                <div>
                    <div id="showRouteDiv"></div>
                </div>
            </div>
            <div class="modal-footer">
                <div style="display: flex">
                    <button type="button" class="btn btn-block btn-danger" style="margin: 5px" onclick="showRouteService.close()">Annuller</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:src="@{/js/approve/showRoute.js}"></script>
<script type="text/javascript" th:src="@{/js/report/listFragment.js}"></script>
<script type="text/javascript" th:src="@{/js/approve/approve.js}"></script>
<script type="text/javascript" th:src="@{/js/admin/reportCard.js}"></script>
<script type="text/javascript" th:src="@{/js/addressService.js}"></script>
<script type="text/javascript" th:src="@{/js/notification.js}"></script>
<script type="text/javascript" th:src="@{/js/admin/substituteApprover.js}"></script>

</body>
</html>
