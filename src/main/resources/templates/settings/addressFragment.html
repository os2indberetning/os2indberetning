<!DOCTYPE html>
<html>
<div id="wrapper wrapper-content">
    <div class="col-sm-12" style="display: flex;">
        <div class="column" style="width: 45%; align: left;">

            <h1 id="homeHead" style="text-align:left;">Afvigende hjemadresse</h1>
            <div>
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" style="text-align:left;">Hjem</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="text" id="homeField" th:value="${homeAddress?.getAddressString}" autocomplete="off" disabled>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" style="text-align:left;">Afvigende hjem &nbsp; <i th:unless="${#strings.isEmpty(@cmsMessageBundle.getText('cms.help.alternative.address.home'))}" class="fa fa-info" style="font-size: 20px;" aria-hidden="true" data-toggle="tooltip" data-html="true" data-placement="top" title="" th:data-original-title="${@cmsMessageBundle.getText('cms.help.alternative.address.home')}"></i></label>
                    <div class="col-sm-8">
                        <input class="addressinput form-control" type="text" placeholder="Indtast adresse" id="dhomeField" th:value="${actualHomeAddress?.getAddressString}" autocomplete="off" list="dhomeFieldList">
                        <dataList id="dhomeFieldList"></dataList>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" style="text-align:left;">Afvigende adresse startdato:</label>
                    <div class="col-sm-8">
                        <input class="form-control addressStartDateInput" type="date" id="deviatingHomeAddressStart" th:value="${#temporals.format(actualHomeAddress?.startDate, 'yyyy-MM-dd')}">
                    </div>
                </div>

                <div class="form-group row">
                    <button id="testKnap" type="button" th:if="${actualHomeAddress} != null" th:data-id="${actualHomeAddress.id}" th:data-parentid="${homeAddress?.id}" data-title="Vil du nulstille den afvigende hjemadresse?" class="btn btn-lg btn-danger" style="margin:5px;" onclick="personalAddressService.del(this)">Nulstil</button>
                    <button type="button" th:if="${actualHomeAddress} == null" th:data-parentid="${homeAddress?.id}" class="btn btn-lg btn-primary" th:data-type="DHOME" th:data-field="dhomeField" style="margin:5px;" onclick="personalAddressService.save(this)">Gem</button>
                    <button type="button" th:if="${actualHomeAddress} != null" th:data-id="${actualHomeAddress.id}" th:data-parentid="${homeAddress?.id}" th:data-field="dhomeField" th:data-type="DHOME" class="btn btn-lg btn-info" style="margin:5px;" onclick="personalAddressService.editSave(this)">Opdater</button>
                </div>
            </div>

            <hr>

            <h1 id="workHead" style="text-align:left;">Afvigende arbejdsadresse</h1>
            <div th:each="workdress : ${workAddresses}">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" style="text-align:left;">Arbejdsadresse</label>
                    <div class="col-sm-8">
                        <input class="addressinput form-control" type="text" id="workField" th:value="${workdress?.officialAddress?.addressString}" autocomplete="off" disabled>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" style="text-align:left;">Afvigende arbejde &nbsp; <i th:unless="${#strings.isEmpty(@cmsMessageBundle.getText('cms.help.alternative.address.work'))}" class="fa fa-info" style="font-size: 20px;" aria-hidden="true" data-toggle="tooltip" data-html="true" data-placement="top" title="" th:data-original-title="${@cmsMessageBundle.getText('cms.help.alternative.address.work')}"></i></label>
                    <div class="col-sm-8">
                        <input class="addressinput form-control" type="text" id="dworkField" placeholder="Indtast adresse" th:value="${workdress.actualAddress?.addressString}" autocomplete="off" list="dworkFieldList">
                        <dataList id="dworkFieldList"></dataList>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" style="text-align:left;">Afvigende adresse startdato:</label>
                    <div class="col-sm-8">
                        <input class="form-control addressStartDateInput" type="date" th:id="deviatingWorkAddressStart + ${workdress.officialAddress?.id}" th:value="${#temporals.format(workdress.actualAddress?.startDate, 'yyyy-MM-dd')}">
                        <p id="driveDateErrorLabel" class="text-danger" hidden></p>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" style="text-align:left;">Afvigende antal km &nbsp; <i th:unless="${#strings.isEmpty(@cmsMessageBundle.getText('cms.help.alternative.home.to.work.distance'))}" class="fa fa-info" style="font-size: 20px;" aria-hidden="true" data-toggle="tooltip" data-html="true" data-placement="top" title="" th:data-original-title="${@cmsMessageBundle.getText('cms.help.alternative.home.to.work.distance')}"></i></label>
                    <div class="col-sm-8">
                        <input class="form-control" type="number" step="0.01" id="dworkKmField" th:value="${workdress?.actualAddress?.homeToWorkDistanceOverrideDeviation}">
                    </div>
                </div>
                <div class="form-group row">
                    <button type="button" th:if="${workdress.actualAddress} != null" th:data-id="${workdress.actualAddress?.id}" th:data-parentid="${workdress.officialAddress?.id}" data-title="Vil du nulstille den afvigende arbejdsadresse?" class="btn btn-lg btn-danger" style="margin:5px;" onclick="personalAddressService.del(this)">Nulstil</button>
                    <button type="button" th:if="${workdress.actualAddress} == null" th:data-parentid="${workdress.officialAddress?.id}" th:data-type="DWORK" th:data-field="dworkField" class="btn btn-lg btn-primary" style="margin:5px;" onclick="personalAddressService.save(this)">Gem</button>
                    <button type="button" th:if="${workdress.actualAddress} != null" th:data-id="${workdress.actualAddress?.id}" th:data-parentid="${workdress.officialAddress.id}" th:data-type="DWORK" th:data-field="dworkField" class="btn btn-lg btn-info" style="margin:5px;" onclick="personalAddressService.editSave(this)">Opdater</button>
                </div>
            </div>

            <hr>

            <h1 style="text-align:left;">Tilføj personlig adresse</h1>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" style="text-align:left;">Ny adresse</label>
                <div class="col-sm-8">
                    <input class="addressinput form-control" type="text" id="addressField" placeholder="Indtast adresse" autocomplete="off" list="addressFieldList">
                    <dataList id="addressFieldList"></dataList>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" style="text-align:left;">Beskrivelse</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" id="descriptionField" placeholder="Skriv beskrivelse">
                </div>
            </div>
            <div class="form-group row">
                <button type="button" id="infoButton" class="btn btn-lg btn-danger" style="margin:5px;" onclick="personalAddressService.loadFragment()">Annuller</button>
                <button type="button" id="saveButton" class="btn btn-lg btn-primary" th:data-type="ALTERNATIVE" th:data-field="addressField" style="margin:5px;" onclick="personalAddressService.save(this)">Gem</button>
                <button type="button" id="editButton" class="btn btn-lg btn-info" th:data-type="ALTERNATIVE"  th:data-field="addressField" style="margin:5px;" onclick="personalAddressService.editSave(this)" hidden="hidden" disabled>Opdater</button>
            </div>

            <hr>

            <h1 style="text-align:left;">Adresseoversigt</h1>
            <div class="table-responsive">
                <table style="padding-right:0px !important;" id="addressTable" class="table table-striped table-bordered table-hover" >
                    <thead>
                    <tr>
                        <th>Adresser</th>
                        <th>Beskrivelse/type</th>
                        <th>Handlinger</th>
                    </tr>
                    </thead>
                    <tfoot style="display: table-row-group">
                    <tr>
                        <td class="input-filter"><input type="text" class="form-control input-sm" placeholder="Søg i adresser" /></td>
                        <td class="input-filter"><input type="text" class="form-control input-sm" placeholder="Søg i beskrivelse" /></td>
                        <td></td>
                    </tr>
                    </tfoot>
                    <tbody>
                    <tr th:each="address : ${addresses}">
                        <td th:text="${address.getAddressString}"></td>
                        <td th:text="${address.description} ?: ${address.type?.description}"></td>
                        <td style="display: flex">
                            <div th:if="${address.type?.name == 'ALTERNATIVE'}"><a th:data-id="${address.id}" th:data-lat="${address.latitude}" th:data-lng="${address.longitude}" th:data-addressString="${address.getAddressString}" th:data-description="${address.description}" th:onclick="personalAddressService.edit(this)"  title="Rediger"><em class="fa fa-fw fa-lg fa-pencil"></em></a></div>
                            <div th:if="${address.type?.name == 'DHOME'}"><a th:data-id="${address.id}" th:data-lat="${address.latitude}" th:data-lng="${address.longitude}" th:data-addressString="${address.getAddressString}" th:data-description="${address.description}" th:onclick="personalAddressService.editJump('home')"  title="Vis på kort"><em class="fa fa-fw fa-lg fa-map-marker "></em></a></div>
                            <div th:if="${address.type?.name == 'DWORK'}"><a th:data-id="${address.id}" th:data-lat="${address.latitude}" th:data-lng="${address.longitude}" th:data-addressString="${address.getAddressString}" th:data-description="${address.description}" th:onclick="personalAddressService.editJump('work')"  title="Vis på kort"><em class="fa fa-fw fa-lg fa-map-marker "></em></a></div>
                            <div th:if="${address.type?.name == 'ALTERNATIVE'}"><a th:data-id="${address.id}" th:onclick="personalAddressService.del(this)"  title="Slet"><em class="fa fa-fw fa-lg fa-times"></em></a></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>


        </div>
        <div class="column" style="width: 5%; align: center;"></div>
        <div class="column" style="width: 50%; align: right;">
            <div id="personalAddressMap" th:data-lat="${primaryAddress.latitude}" th:data-lng="${primaryAddress.longitude}" style="height: 100%;"></div>
        </div>
    </div>
</div>

</html>
