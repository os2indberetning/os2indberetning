<!DOCTYPE html>
<html>
<div id="wrapper wrapper-content">
    <div class="col-sm-12">
        <div class="row">
            <div class="col-sm-10">
                <h1>
                    Opret eller nulstil adgangskode til app
                    <i th:unless="${#strings.isEmpty(@cmsMessageBundle.getText('cms.help.mobile.token'))}" class="fa fa-info" style="font-size: 20px;" aria-hidden="true" data-toggle="tooltip" data-html="true" data-placement="top" title="" th:data-original-title="${@cmsMessageBundle.getText('cms.help.mobile.token')}"></i>
                </h1>
            </div>
            <div class="col-sm-2">
                <div th:if="${appLog == null}">
                    <button type="button" class="btn btn-primary" style="float: right; margin: 5px" onclick="appLoginService.create()">Tilføj app login</button>
                </div>
            </div>
        </div>
        <div class="table-responsive">
            <table style="padding-right:0px !important;" id="rateTable" class="table table-striped table-bordered table-hover" >
                <thead>
                <tr>
                    <th>Brugernavn</th>
                    <th>Har adgangskode</th>
                    <th>Handlinger:</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appLog: ${appLog}">
                    <td th:text="${appLog.username}"></td>
                    <td><a th:class="${appLog.password} ? 'fa fa-lg fa-check-circle'"/></td>
                    <td>
                        <a th:data-id="${appLog.id}" th:data-username="${appLog.username}" th:onclick="appLoginService.edit(this)" title="Nulstil kodeord"><em class="fa fa-lg fa-pencil"></em></a>
                        &nbsp;
                        <a th:data-id="${appLog.id}" th:onclick="appLoginService.del(this)" title="Slet"><em class="fa fa-lg fa-times"></em></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="modal inmodal" id="appLoginModal" tabindex="-1" role="dialog" style="display: none;" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content animated fadeIn">
                    <div class="modal-header">
                        <button type="button" class="close" onclick="appLoginService.load()">
                            <span><em class="fa fa-lg fa-times"></em></span>
                            <span class="sr-only">Luk</span>
                        </button>
                        <h4 class="modal-title">Login til app</h4>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="appLogId">
                        <div class="form-group row">
                            <label class="col-sm-2 col-form-label" style="text-align:left;">Brugernavn</label>
                            <div class="col-sm-10">
                                <input class="form-control" id="appUsername">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-2 col-form-label" style="text-align:left;">Indtast adgangskode</label>
                            <div class="col-sm-10">
                                <input type="password" class="form-control" id="passwordProper">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-2 col-form-label" style="text-align:left;">Bekræft kodeord</label>
                            <div class="col-sm-10">
                                <input type="password" class="form-control" id="passwordConfirm">
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" onclick="appLoginService.close()">Luk</button>
                        <button type="button" class="btn btn-primary" id="butAppCrea" onclick="appLoginService.createSave()">Opret</button>
                        <button type="button" class="btn btn-primary" id="butAppEdit" onclick="appLoginService.editSave()">Gem ændring</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
